<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宝贝，我想和你聊聊</title>
<link rel="stylesheet" href="css/main.css">
</head>

<body>

<div class="box">

    <img src="img/3.jpeg" alt="photo">

    <h1>宝贝，我想和你聊聊 ❤️</h1>

    <p>
        分开的这段时间，<br>
        我想了很多很多。<br><br>

        我才发现，原来你早已经成为我生活里很重要的一部分。<br><br>

        我想念你的笑，<br>
        想念和你聊天的日子，<br>
        也想念我们一起经历过的那些小事。<br><br>

        我知道，回到过去并不容易。<br><br>

        那些争吵、那些不开心，<br>
        也许让你失望过，也让你累过。<br><br>

        但我还是想告诉你：<br><br>

        我很珍惜你，<br>
        也很珍惜我们曾经拥有的一切。<br><br>

        如果你愿意，<br>
        我想和你一起创造一个新的开始。
    </p>

    <div class="buttons">
        <button id="hao">给彼此一个机会 ❤️</button>
        <button id="buhao">我还需要想想</button>
    </div>

</div>


<div id="popup">
    <div class="popup-box">
        <p id="popup-text"></p>
        <button onclick="closePopup()">确定</button>
    </div>
</div>


<audio id="music" loop>
    <source src="music/love.mp3" type="audio/mpeg">
</audio>


<script src="js/yiqi.js"></script>

</body>
</html>
